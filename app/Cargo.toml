[package]
name = "desk_app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "desk-ctrl"
path = "src/main.rs"

[dependencies]
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui-phosphor = { version = "0.14.0", features = ["bold"] }
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
linak_desk = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
