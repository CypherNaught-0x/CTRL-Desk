[package]
name = "desk_app"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "desk-ctrl"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui-phosphor = { version = "0.14.0", features = ["bold"] }
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["ico", "png"] }
linak_desk = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
ureq = "3.5.0"

[build-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Foundation"] }
