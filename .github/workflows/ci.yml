name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bluetooth (BlueZ over D-Bus) and windowing libraries needed to build on Linux.
  LINUX_DEPS: >-
    pkg-config libdbus-1-dev libxkbcommon-dev libwayland-dev libx11-dev
    libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --workspace --release --locked

  # Runs the app in demo mode under a virtual display: a smoke test that it
  # starts and renders on Linux, plus fresh README screenshots as an artifact.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS xvfb mesa-vulkan-drivers libegl1
      - uses: Swatinem/rust-cache@v2
      - run: xvfb-run -a -s "-screen 0 1920x1200x24" scripts/screenshots.sh screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
